# Task 24g: Nginx as the sole internet-facing process. Reverse-proxies to
# Daphne (127.0.0.1:8001, Task 24f), serves static/media directly, and sets
# exactly the two headers bancostore/settings.py's production block (Task
# 24d) is written to trust: X-Forwarded-Proto (SECURE_PROXY_SSL_HEADER) and
# X-Real-IP (RATELIMIT_IP_META_KEY). Certbot (run separately, `certbot
# --nginx`) rewrites this file to add the actual HTTPS server block and
# redirect -- this version is the pre-certbot HTTP-only starting point.

server {
    listen 80;
    listen [::]:80;
    server_name bancostore.com www.bancostore.com;

    client_max_body_size 20M;

    location /static/ {
        alias /home/bancostore/bancostore/staticfiles/;
    }

    location /media/ {
        alias /home/bancostore/bancostore/media/;
    }

    # Channels/WebSockets (Task 20d, 21d) -- must come before the generic `/`
    # location so it matches first; needs the Upgrade/Connection headers a
    # plain HTTP proxy_pass doesn't send.
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Matches RATELIMIT_IP_META_KEY = "HTTP_X_REAL_IP" in settings.py --
        # $remote_addr here is Nginx's own view of the real client IP (the
        # actual visitor, not a header the visitor could forge themselves).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Matches SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")
        # in settings.py -- $scheme is "https" once certbot's rewrite adds the
        # 443 server block below, "http" for now.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
