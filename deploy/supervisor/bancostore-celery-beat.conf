; Task 24f: Celery Beat, kept alive by Supervisor across crashes and VPS
; reboots. Uses django_celery_beat.schedulers:DatabaseScheduler (already set
; in bancostore/settings.py's CELERY_BEAT_SCHEDULER), so the schedule itself
; lives in MySQL, not a local pickle file -- safe to restart with no state to
; lose. numprocs MUST stay 1 -- a second Beat instance would double-fire
; every periodic task (binary bonus, matching bonus, withdrawal payout, PV
; expiry, etc.), a real money-safety bug class, not just a nuisance.
[program:bancostore-celery-beat]
command=/home/bancostore/bancostore/venv/bin/celery -A bancostore beat -l info
directory=/home/bancostore/bancostore
user=bancostore
autostart=true
autorestart=true
numprocs=1
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/home/bancostore/bancostore/logs/celery_beat.log
stderr_logfile=/home/bancostore/bancostore/logs/celery_beat_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
