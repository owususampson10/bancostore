; Task 24f: Celery worker, kept alive by Supervisor across crashes and VPS
; reboots. stopasgroup/killasgroup are required, not optional -- the default
; prefork pool forks child processes, and without these, Supervisor's stop
; signal only reaches the parent, leaving child processes (and any
; in-progress commission/wallet/withdrawal task they hold) orphaned. This is
; Celery's own documented Supervisor gotcha, not a guess.
[program:bancostore-celery-worker]
command=/home/bancostore/bancostore/venv/bin/celery -A bancostore worker -l info
directory=/home/bancostore/bancostore
user=bancostore
autostart=true
autorestart=true
numprocs=1
stopsignal=TERM
; Generous window so an in-flight commission/wallet/withdrawal task (see
; CLAUDE.md's elevated-rigor apps) can finish cleanly rather than being
; SIGKILLed mid-transaction on a deploy or reboot.
stopwaitsecs=600
stopasgroup=true
killasgroup=true
stdout_logfile=/home/bancostore/bancostore/logs/celery_worker.log
stderr_logfile=/home/bancostore/bancostore/logs/celery_worker_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
