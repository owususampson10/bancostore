; Task 24f: ASGI server (Channels/WebSockets), kept alive by Supervisor across
; crashes and VPS reboots. Binds to 127.0.0.1 only -- Nginx (Task 24g) is the
; sole internet-facing process, matching the trust assumption already baked
; into bancostore/settings.py's SECURE_PROXY_SSL_HEADER/RATELIMIT_IP_META_KEY
; (Task 24d): if Daphne were ever reachable directly, an external client could
; spoof X-Forwarded-Proto/X-Real-IP and bypass that trust model entirely.
[program:bancostore-daphne]
command=/home/bancostore/bancostore/venv/bin/daphne -b 127.0.0.1 -p 8001 bancostore.asgi:application
directory=/home/bancostore/bancostore
user=bancostore
autostart=true
autorestart=true
numprocs=1
stopsignal=TERM
stopwaitsecs=30
; Without this, print()-based output (e.g. apps/notifications/sms.py's fake
; SMS sender, used whenever MNOTIFY_API_KEY is unset) sits in Python's
; stdout buffer and never reaches this log for a long-running process --
; the exact same class of gotcha this project already documented once for
; Django's autoreloader dropping the -u flag (see CLAUDE.md). Found live
; during Task 24h's smoke test when a fake OTP SMS never appeared here.
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/home/bancostore/bancostore/logs/daphne.log
stderr_logfile=/home/bancostore/bancostore/logs/daphne_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
