[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bancostore.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# Task 60: scripts/floor_guard.py does `from _gitdiff import ...`, a
# sibling top-level import that resolves because CI runs it as
# `python scripts/floor_guard.py`. Putting scripts/ on the path here lets
# its tests import it the same way it really runs, rather than
# restructuring the script to suit its test or hacking sys.path inside
# the test module -- which would need a lint-suppression comment, itself
# a floor violation.
pythonpath = ["scripts"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_django = ["django"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["migrations", "venv", "node_modules", "static"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Curated, fetched-not-authored SVG path data (Task 35) -- each <path
# d="..."> string is one unbreakable literal from the real Simple Icons
# source, not code that should ever be manually reformatted or wrapped.
"apps/pages/social_icons.py" = ["E501"]
