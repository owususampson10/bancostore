[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bancostore.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_django = ["django"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["migrations", "venv", "node_modules", "static"]

[tool.ruff.lint]
select = ["E", "F", "W"]
