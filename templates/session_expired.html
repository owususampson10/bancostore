{% extends "errors/base_error.html" %}
{% block title %}Session Expired - Bancostore{% endblock %}
{% block error_content %}
<div class="w-24 h-24 rounded-full bg-primary-fixed flex items-center justify-center mb-8">
<span class="material-symbols-outlined text-primary" style="font-size: 40px;" aria-hidden="true">refresh</span>
</div>
<h1 class="text-2xl md:text-3xl font-extrabold text-on-surface mb-2">Your Session Expired</h1>
<p class="text-base md:text-lg text-secondary mb-10">For your security, this page timed out. Please refresh and try again.</p>
<div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
<button type="button" onclick="window.location.reload()" class="bg-primary text-on-primary font-bold text-sm uppercase tracking-widest px-8 py-3 rounded-full hover:brightness-110 transition-all w-full sm:w-auto">Refresh Page</button>
<a href="{% url 'catalog:home' %}" class="border border-outline text-on-surface font-bold text-sm uppercase tracking-widest px-8 py-3 rounded-full hover:bg-surface-container-low transition-colors w-full sm:w-auto inline-flex items-center justify-center">Back to Home</a>
</div>
{% endblock %}
