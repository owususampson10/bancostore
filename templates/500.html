{% extends "errors/base_error.html" %}
{% block title %}500 Server Error - Bancostore{% endblock %}
{% block error_content %}
<div class="max-w-md w-full flex flex-col items-center gap-6 bg-surface-container-low p-8 md:p-12 rounded-3xl border border-surface-variant">
<div class="w-24 h-24 rounded-full bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-error-container" style="font-size: 48px;" aria-hidden="true">error</span>
</div>
<h1 class="text-2xl md:text-3xl font-extrabold text-on-surface">Something Went Wrong</h1>
<p class="text-base text-secondary">We're having trouble on our end. Please try again in a moment.</p>
<a href="{% url 'catalog:home' %}" class="w-full md:w-auto min-w-[200px] inline-flex items-center justify-center px-8 py-4 bg-primary text-on-primary font-bold text-sm uppercase tracking-widest rounded-full hover:bg-primary-container transition-colors">Back to Home</a>
<a href="{% url 'pages:contact' %}" class="text-sm text-secondary hover:text-primary underline underline-offset-4 transition-colors">Still having trouble? Contact us.</a>
</div>
{% endblock %}
