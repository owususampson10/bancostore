{% extends "base_auth.html" %}
{% block title %}Bancostore | Password reset successfully{% endblock %}
{% block auth_content %}
<div class="relative w-full max-w-md mx-auto bg-white rounded-xl auth-card p-stack-xl flex flex-col items-center text-center">
<div class="mb-stack-lg relative">
<div class="w-24 h-24 bg-success/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-success text-[56px]" style="font-variation-settings: 'FILL' 1;">
check_circle
</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">
Password Reset Successfully
</h1>
<p class="font-body-md text-body-md text-gray-muted mb-stack-xl max-w-[280px]">
Your password has been updated. You can now log in to your account.
</p>
<a class="w-full bg-primary hover:opacity-90 text-white font-label-lg text-label-lg py-4 rounded-lg transition-all duration-200 active:scale-95 flex items-center justify-center gap-2" href="{% url 'account_login' %}">
Log In
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</a>
</div>
{% endblock %}
